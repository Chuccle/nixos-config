name: cache

on:
  push:
    branches: [main]
  pull_request:
  # A cache-population workflow is worth being able to start by hand: after a
  # lock bump, or to refill the cache without an empty commit to trigger it.
  workflow_dispatch:

# Nothing here writes to the repository. The token still needs `contents: read`
# so the checkout works and so install-nix-action can hand nix an authenticated
# github.com fetcher.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR churn is worth cancelling — a superseded run is building a commit nobody
  # will merge. A push to main is not: that run is the one filling the cache for
  # every later build, and killing it half way means the next run re-pays
  # whatever it had already compiled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `checks` covers every host toplevel and the three lint checks; `devShells`
  # is a couple of minutes and rides along beside it. Scoping to our own attrs
  # (rather than a bare `--flake .`) avoids recursing into `self.inputs`.
  build:
    runs-on: ubuntu-latest
    # A warm run is single-digit minutes; GitHub's own ceiling is six hours.
    # This sits far enough above the first that a legitimately cold build never
    # trips it, and far enough below the second that a run which has stopped
    # substituting and started compiling everything fails visibly instead of
    # grinding on unwatched. Standard runners are free on a public repository,
    # so what this protects is attention, not a minutes budget.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # Independent runners, so independent logs and independent failures.
      matrix:
        attr: [checks, devShells]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/nix-build
        with:
          attr: ${{ matrix.attr }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # After `build`, not beside it. Every LXC tarball here contains the host
  # toplevel that `checks` builds as `host-<name>`, and two runners share no
  # store — so run in parallel they each compiled the same four closures from
  # scratch. That is not a rounding error: the run before this job existed
  # compiled zeroclaw's Rust workspace twice at once, 42m43s a side, because
  # `zeroclaw-server-lxc` is both a check and a package. Ordered this way the
  # toplevels are already in cachix by the time this starts, and only the
  # tarballs are new work. Standard runners are free on a public repository, so
  # the win is not a bill: it is not doing the same forty minutes twice, and
  # not running two jobs that can each hit the six-hour ceiling alone.
  #
  # `!cancelled()` rather than `success()`: a failing lint check says nothing
  # about whether the tarballs build, and the point of the split was to keep
  # those two answers separate. It does mean this job can start cold when
  # `build` failed, which is why its timeout matches rather than undercuts.
  packages:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() }}
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/nix-build
        with:
          attr: packages
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
