name: cache

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ente-server-lxc
            timeout: 60
            select: >-
              f: {
                inherit (f.outputs.checks.x86_64-linux) host-ente-server-lxc;
                inherit (f.outputs.packages.x86_64-linux) ente-server-lxc;
              }

          - name: ida-pro
            timeout: 60
            select: >-
              f: { inherit (f.outputs.packages.x86_64-linux) ida-pro; }

          # Everything the jobs above do not claim.
          - name: rest
            timeout: 60
            select: >-
              f: {
                checks = builtins.removeAttrs f.outputs.checks.x86_64-linux [ "host-ente-server-lxc" ];
                packages = builtins.removeAttrs f.outputs.packages.x86_64-linux [ "ente-server-lxc" "ida-pro" ];
                devShells = f.outputs.devShells.x86_64-linux;
              }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/nix-build
        with:
          select: ${{ matrix.select }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
