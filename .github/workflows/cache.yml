name: cache

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish-iso:
        description: Upload the blorg live ISO for download
        type: boolean
        default: false
      build-desktops:
        description: Build the desktop hosts instead of only evaluating them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ai-lxc
            timeout: 60
            select: >-
              f: {
                system = f.outputs.nixosConfigurations.ai-lxc.config.system.build.toplevel;
                tarball = f.outputs.packages.x86_64-linux.ai-lxc;
              }

          - name: ente-server-lxc
            timeout: 60
            select: >-
              f: {
                system = f.outputs.nixosConfigurations.ente-server-lxc.config.system.build.toplevel;
                tarball = f.outputs.packages.x86_64-linux.ente-server-lxc;
              }

          - name: ida-pro
            timeout: 60
            select: >-
              f: { inherit (f.outputs.packages.x86_64-linux) ida-pro; }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/nix-build
        with:
          select: ${{ matrix.select }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # nix flake check builds only the lint checks, but still evaluates every
  # host, so a broken configuration fails here without building a system.
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = true

      - run: nix flake check --keep-going

  # A desktop closure recompiles for far longer than a pull request should hold
  # a runner, so it only runs when asked for. eval-<host> checks in the other
  # jobs cover evaluation on every run.
  desktops:
    name: desktops
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs['build-desktops'] || inputs['publish-iso']) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The desktop closures are far larger than the 5 GiB cache; building them
      # is the point, publishing them would evict every server.
      - uses: ./.github/actions/nix-build
        with:
          select: >-
            f: { inherit (f.outputs.checks.x86_64-linux) host-blorg host-blorg-live; }
          publish: "false"
          cachix-auth-token: ""

      - name: Fetch live ISO
        if: inputs['publish-iso']
        run: nix build .#blorg-live --out-link "$RUNNER_TEMP/blorg-live"

      - name: Upload live ISO
        if: inputs['publish-iso']
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/blorg-live/iso/*.iso
          archive: false
          if-no-files-found: error
          retention-days: 3
