name: cache

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish-iso:
        description: Upload the blorg live ISO for download
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ente-server-lxc
            timeout: 60
            select: >-
              f: {
                inherit (f.outputs.checks.x86_64-linux) host-ente-server-lxc;
                inherit (f.outputs.packages.x86_64-linux) ente-server-lxc;
              }

          - name: ida-pro
            timeout: 60
            select: >-
              f: { inherit (f.outputs.packages.x86_64-linux) ida-pro; }

          # Everything the jobs above do not claim.
          - name: rest
            timeout: 60
            select: >-
              f: {
                checks = builtins.removeAttrs f.outputs.checks.x86_64-linux [ "host-ente-server-lxc" ];
                packages = builtins.removeAttrs f.outputs.packages.x86_64-linux [ "ente-server-lxc" "ida-pro" ];
                devShells = f.outputs.devShells.x86_64-linux;
              }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/nix-build
        with:
          select: ${{ matrix.select }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Fetch live ISO
        if: github.event_name == 'workflow_dispatch' && inputs.publish-iso && matrix.name == 'rest'
        run: nix build .#blorg-live --out-link "$RUNNER_TEMP/blorg-live"

      - name: Upload live ISO
        if: github.event_name == 'workflow_dispatch' && inputs.publish-iso && matrix.name == 'rest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/blorg-live/iso/*.iso
          archive: false
          if-no-files-found: error
          retention-days: 3
