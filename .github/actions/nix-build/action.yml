name: nix-build
description: Build a selection of this flake's outputs and push them to cachix.

inputs:
  select:
    description: Function from `{ inputs, outputs }` to the attrset to build.
    required: true
  cachix-auth-token:
    description: Token the push authenticates with.
    required: true

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes pipe-operators
          extra-substituters = https://chuccle.cachix.org https://nix-community.cachix.org
          extra-trusted-public-keys = chuccle.cachix.org-1:FT8Le4No+sZMyaQEqyWAJdbikbo9CGRQxnFkB9Tl27w= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: chuccle
        authToken: ${{ inputs.cachix-auth-token }}
        skipPush: true

    - name: Fetch flake inputs and nix-fast-build
      shell: bash
      run: |
        nix flake archive --json | jq -r '.inputs | .. | .path? // empty' | cachix push chuccle
        nix build --inputs-from . --out-link "$RUNNER_TEMP/nix-fast-build" nixpkgs#nix-fast-build

    - name: Build and cache
      shell: bash
      run: |
        "$RUNNER_TEMP/nix-fast-build/bin/nix-fast-build" \
          --flake . \
          --select "$SELECT" \
          --no-nom \
          --skip-cached \
          --cachix-cache chuccle
      env:
        SELECT: ${{ inputs.select }}
        CACHIX_AUTH_TOKEN: ${{ inputs.cachix-auth-token }}
