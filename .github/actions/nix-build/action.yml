name: nix-build
description: Build a selection of this flake's outputs and push them to cachix.

inputs:
  select:
    description: Function from `{ inputs, outputs }` to the attrset to build.
    required: true
  cachix-auth-token:
    description: Token the push authenticates with.
    required: true

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes pipe-operators
          accept-flake-config = true

    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: chuccle
        authToken: ${{ inputs.cachix-auth-token }}
        skipPush: true

    - name: Fetch flake inputs and nix-fast-build
      shell: bash
      run: |
        # 2.35's eval workers deadlock fetching flake inputs concurrently, so
        # they are fetched once up front on every run - including pull
        # requests, whose lockfile may reference inputs no cache holds yet.
        nix flake archive --json >"$RUNNER_TEMP/inputs.json"

        if [ "$GITHUB_REF" = "refs/heads/main" ]; then
          jq -r '.inputs | .. | .path? // empty' "$RUNNER_TEMP/inputs.json" | cachix push chuccle
        fi

        nix build --inputs-from . --out-link "$RUNNER_TEMP/nix-fast-build" nixpkgs#nix-fast-build

    - name: Build and cache
      shell: bash
      run: |
        # Pushing the closure from every pull request spent most of the job on
        # upload and evicted what main needs from a 5 GiB cache, so only main
        # publishes. Pulls still substitute from chuccle.
        pushArgs=()
        if [ "$GITHUB_REF" = "refs/heads/main" ]; then
          pushArgs=(--cachix-cache chuccle)
        fi

        "$RUNNER_TEMP/nix-fast-build/bin/nix-fast-build" \
          --flake . \
          --select "$SELECT" \
          --no-nom \
          --skip-cached \
          "${pushArgs[@]}"
      env:
        SELECT: ${{ inputs.select }}
        CACHIX_AUTH_TOKEN: ${{ inputs.cachix-auth-token }}
