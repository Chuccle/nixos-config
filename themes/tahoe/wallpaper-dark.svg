<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tahoe wallpaper, dark. Authored rather than fetched, so there is no asset to hash
  and no upstream to rot — and written as SVG rather than a chain of
  ImageMagick operations, because layered light is exactly what gradients
  describe well and shell pipelines describe badly.

  The dark side of ./wallpaper-light.svg: the same cloth, the same ribbons in
  the same places, lit from the same corner — the tones are simply taken to the
  bottom of the range, so switching appearance changes the light in the room
  rather than the room.

  The subject is silk: a ground with a few broad ribbons of light drawn across
  it, each one a wide path under a heavy blur so no edge of the geometry
  survives. Ribbons rather than radial blooms because the glass
  surfaces above sample whatever is behind them — a bar or a dock crossing a
  bloom picks up one flat tone, while crossing a ribbon it picks up a gradient,
  which is the whole reason the effect reads as glass.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#2a221c"/>
      <stop offset="45%" stop-color="#211a15"/>
      <stop offset="100%" stop-color="#191410"/>
    </linearGradient>

    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d5137" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a2a1c" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="pale" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#c2a075" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5c452c" stop-opacity="0.14"/>
    </linearGradient>

    <linearGradient id="deep" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1611" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#171210" stop-opacity="0.35"/>
    </linearGradient>

    <!-- One heavy blur, shared. The ribbons are drawn as plain paths and
         softened here rather than being built from dozens of stops. -->
    <filter id="soften" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>

    <filter id="soften-hard" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>

    <linearGradient id="deepRibbon" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#181310" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#131010" stop-opacity="0.4"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.62" cy="0.28" r="0.55">
      <stop offset="0%" stop-color="#f0d5ac" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#c99a63" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c99a63" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.8">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#171210" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Fine monochrome grain. Wide, smooth gradients band badly on 8-bit
         displays; a trace of noise dithers the steps away. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <!-- feTurbulence writes noise into the alpha channel as well as the
           colour ones, and compositing that over a near-black ground leaves
           visible colour fringes. Flattening alpha to 1 first makes it plain
           grey noise, dimmed by the layer's own opacity. -->
      <feComponentTransfer>
        <feFuncA type="table" tableValues="1 1"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#ground)"/>

  <!-- GROUND BANDS
       Two broad sweeps that set where the picture is warm and where it is
       pale. Everything below is drawn over these. -->
  <g filter="url(#soften)">
    <path d="M -400 1520 C 700 1120, 1500 1460, 2300 1060 C 3000 720, 3500 930, 4240 620 L 4240 2360 L -400 2360 Z" fill="url(#warm)"/>
    <path d="M -400 2020 C 600 1760, 1600 1940, 2500 1600 C 3200 1340, 3700 1460, 4240 1200 L 4240 2360 L -400 2360 Z" fill="url(#deep)"/>
  </g>

  <!-- RIBBONS
       The silk itself: long, thin, nearly parallel sweeps at a shallower
       blur, so an edge is visible without ever becoming a hard line. Their
       spacing is deliberately uneven — evenly spaced bands read as a
       pattern, uneven ones read as folded cloth. -->
  <g filter="url(#soften-hard)">
    <path d="M -400 1120 C 600 840, 1400 1080, 2200 760 C 2900 480, 3500 640, 4240 360 L 4240 560 C 3500 840, 2900 680, 2200 960 C 1400 1280, 600 1040, -400 1320 Z" fill="url(#pale)"/>
    <path d="M -400 1330 C 620 1060, 1420 1300, 2240 980 C 2940 700, 3540 860, 4240 580 L 4240 690 C 3540 970, 2940 810, 2240 1090 C 1420 1410, 620 1170, -400 1440 Z" fill="url(#pale)" opacity="0.5"/>
    <path d="M -400 1700 C 700 1400, 1500 1660, 2400 1280 C 3100 990, 3600 1140, 4240 870 L 4240 1010 C 3600 1280, 3100 1130, 2400 1420 C 1500 1800, 700 1540, -400 1840 Z" fill="url(#pale)" opacity="0.6"/>
    <path d="M -400 1900 C 700 1620, 1600 1860, 2500 1500 C 3200 1220, 3700 1360, 4240 1100 L 4240 1180 C 3700 1440, 3200 1300, 2500 1580 C 1600 1940, 700 1700, -400 1980 Z" fill="url(#deepRibbon)" opacity="0.7"/>
  </g>

  <!-- The specular sweep: where the light lands on the cloth. -->
  <rect width="3840" height="2160" fill="url(#glow)"/>
  <rect width="3840" height="2160" filter="url(#grain)" opacity="0.09"/>
  <rect width="3840" height="2160" fill="url(#vignette)"/>
</svg>
