filter-syscalls = false
experimental-features = nix-command flakes pipe-operators
extra-platforms = aarch64-linux
trusted-users = root vscode

# SUBSTITUTERS
# Set here rather than relying on the flake's own `nixConfig`: flake-supplied
# substituters are ignored in any non-interactive invocation unless
# `accept-flake-config` is on, and turning that on would accept substituters
# from every flake this container ever evaluates. These two are the ones this
# repo actually needs.
#
# cache.numtide.com carries the llm-agents package set — without it the
# zeroclaw host compiles a large Rust workspace from source on every rebuild.
extra-substituters = https://cache.numtide.com https://nix-community.cachix.org
extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

# BUILD PARALLELISM
# The previous `max-jobs = 1` with the default `cores` let one derivation take
# every core, and a big Rust or Qt link step then spikes memory hard enough to
# take the Docker engine down with it. Two jobs of four cores bounds total
# concurrency at eight and keeps peak memory to roughly two linkers rather
# than twelve compiler processes.
max-jobs = 2
cores = 4

# Keep failed build trees out of the container's writable layer.
keep-failed = false
